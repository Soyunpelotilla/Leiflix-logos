name: Descargar logos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar imagenes
        run: |
          mkdir -p logos
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            nombre=$(basename "$url")
            echo "Descargando $nombre"
            curl -sL --fail "$url" -o "logos/$nombre" || echo "FALLO: $url"
          done < urls.txt

      - name: Commit y push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add logos
          git commit -m "Descargar logos" || echo "Nada que commitear"
          git push
